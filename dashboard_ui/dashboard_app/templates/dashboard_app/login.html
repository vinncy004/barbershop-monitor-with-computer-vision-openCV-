{% extends "dashboard_app/base.html" %}

{% block content %}
<section class="form-card">
    <h2>Welcome Back</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button button-primary">Log In</button>
    </form>
    <p>Need an account? <a href="{% url 'dashboard_app:signup' %}">Sign up</a>.</p>
</section>
{% endblock %}
