{% extends 'dashboard_app/base.html' %}

{% block title %}Sign Up{% endblock %}

{% block page_title %}Create Account{% endblock %}

{% block content %}
<section class="form-card">
    <h2>Sign Up</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button button-primary">Create Account</button>
    </form>
    <p>Already have an account? <a href="{% url 'dashboard_app:login' %}">Log in</a>.</p>
</section>
{% endblock %}
